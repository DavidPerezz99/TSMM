agent:
  enabled: true
  mode: mode_a
  default_start_mode_a: true
  confirm_live_execution: true
  signal_interpretation: contrarian
  followup_agent_a_requires_approval: false
  approval_channels:
  - telegram
  timezone: America/Bogota
mode_a:
  enabled: true
  max_operations_per_session: 1
  allow_long: true
  allow_short: true
  selected_model: ''
  use_llm_explanation: true
  block_on_confidence_thresholds: false
  block_on_input_fooling_risk: false
agent_a_fallback:
  enabled: true
  auto_discover: true
  target_families:
  - high
  - low
  - close
  - open
  prefer_timeframes:
  - 3h
  - 1h
  - 30m
  - 10m
  - 12h
  - 24h
  - 1w
  max_attempts: 24
  attempts:
  - config_path: config/high3hResults/nbeats/top1_09353.yaml
    timeframe: 3h
    model: nbeats
  - config_path: config/high30mResults/nbeats/top1_07163.yaml
    timeframe: 30m
    model: nbeats
  - config_path: config/high10mResults/nbeats/top1_07175.yaml
    timeframe: 10m
    model: nbeats
mode_b:
  enabled: true
  allow_open_new_positions: false
  manage_existing_positions: true
  poll_seconds: 300
  allow_endpoint_signals: true
  close_consensus_threshold: 0.25
  interrupt_flag_path: reports/runtime/ftmo/mode_b_interrupt.flag
  operation_limits:
    per_timeframe:
      10m: 2
      30m: 2
      1h: 2
      3h: 2
      7h: 1
      12h: 1
      24h: 1
      1w: 1
risk:
  risk_per_trade_pct: 0.5
  daily_max_loss_pct: 2.0
  weekly_max_loss_pct: 5.0
  max_drawdown_pct: 15.0
  max_open_positions: 5
  stop_loss_pct: 0.8
  take_profit_pct: 1.6
  trailing:
    enabled: true
    mode: probability
    trail_pct_base: 0.5
    breakeven_activation_ratio: 0.75
    min_confidence_to_extend: 0.65
  min_confidence_to_trade: 0.5
  min_cm_accuracy_to_trade: 0.5
  max_input_fooling_risk: 0.45
execution:
  symbol: XAUUSD
  default_volume: 0.01
  market_schedule:
    timezone: America/Bogota
    max_wait_seconds: 7200
    closed_windows:
      XAUUSD:
      - start: '16:00'
        end: '17:00'
  allowed_volume_by_timeframe:
    10m: 0.01
    30m: 0.01
    1h: 0.01
    3h: 0.01
    7h: 0.01
    12h: 0.01
    24h: 0.01
    1w: 0.01
  slippage_bps: 2.0
  commission_per_trade: 0.0
  spread_bps: 2.0
broker:
  active: mt5
  mt5:
    enabled: true
    login: env:MT5_FTMO_LOGIN
    password: env:MT5_FTMO_PASSWORD
    server: FTMO-Server3
    path: C:\Program Files\FTMO Global Markets MT5 Terminal\terminal64.exe
  iqoption:
    enabled: false
    email: env:IQOPTION_EMAIL
    password: env:IQOPTION_PASSWORD
    balance_mode: PRACTICE
model_endpoints:
  10m: http://127.0.0.1:8000/predict/10m
  30m: http://127.0.0.1:8000/predict/30m
  1h: http://127.0.0.1:8000/predict/1h
  3h: http://127.0.0.1:8000/predict/3h
  7h:
    url: http://127.0.0.1:8000/predict/7h
    model: ulr
    config_path: config/high7hResults/ulr/top1_07890.yaml
  12h: http://127.0.0.1:8000/predict/12h
  24h: http://127.0.0.1:8000/predict/24h
  1w: http://127.0.0.1:8000/predict/1w
reporting:
  enabled: true
  output_dir: reports/trading_plans
  filename_prefix: trading_plan
probability_maps:
  enabled: true
  n_paths: 1200
  n_price_bins: 70
trading_job:
  order_submission_mode: programmed
  prevent_new_programmed_when_open_position: false
  prevent_new_programmed_when_pending_exists: false
  intentional_same_side_stacking:
    enabled: true
    max_same_side_orders: 3
    auto_enable_on_high_confidence: true
    auto_stack_confidence_threshold: 0.54
    auto_stack_target_orders: 2
  session_hours: 7
  first_session_grounding_timeframe: 7h
  repeat_session_grounding_timeframe: 3h
  live_request_grounding_timeframes:
  - 1h
  - 30m
  - 10m
  approval_after_hours: 24
  extension_max_hours: 168
  extension_request_window_minutes: 15
  approval_timeout_seconds: 1800
  fill_check_seconds: 30
  programmed_order_expiration_minutes: 420
  max_wait_fill_minutes: 420
  cleanup_closed_jobs: true
runtime:
  root_dir: reports/runtime/ftmo
  job_id_prefix: FTMO
  profile_label: FTMO
account_mirror:
  enabled: true
  peer_profile: Pepperstone
  peer_trading_config_path: config/trading_agent.yaml
  mirror_job_starts: true
  mirror_stop_requests: true
  mirror_kill_requests: true
  mirror_agent_b_risk_updates: true
  mirror_agent_b_close_actions: true
opposing_countertrade:
  enabled: true
  allow_source_buy: false
  launch_when_source_submission_mode: programmed
  min_source_confidence: 0.54
  target_price_tolerance_abs: 2.0
  stop_distance_multiplier: 1.0
  enforce_mirror_parity: true
  mirror_parity_wait_seconds: 45
  mirror_parity_poll_seconds: 3
autonomous_trading:
  enabled: true
  timezone: America/Bogota
  scan_interval_seconds: 300
  pending_order_maintenance:
    enabled: true
    assessment_timeout_seconds: 3.0
    cancel_opposed_consensus_threshold: 0.25
    entry_cross_tolerance_abs: 0.05
  followup_enabled: true
  followup_submission_mode: market
  mandatory_session_cooldown_seconds: 600
  followup_cooldown_seconds: 300
  max_followup_launches_per_session: 84
  max_filtered_followups_per_session: 84
  min_success_probability_for_followup: 0.58
  min_confidence_for_followup: 0.55
  min_cm_accuracy_for_followup: 0.52
  max_input_fooling_risk_for_followup: 0.45
  require_consensus_alignment_for_followup: true
  session_windows:
  - name: asia_australia
    start: '17:00'
    end: 07:00
  - name: london
    start: 07:00
    end: '14:00'
  - name: new_york
    start: '14:00'
    end: '21:00'
llm:
  enabled: true
  provider: local_ollama
  providers_config_path: config\llm_providers.yaml
  timeout_seconds: 120
  assist_every_seconds: 300
  signal_analysis:
    enabled: true
    max_context_chars: 14000
    include_sentiment: true
    include_technical_metrics: true
sentiment:
  enabled: true
  symbol: GC=F
  enable_yahoo: true
  enable_reddit: true
  enable_tradingview: true
  tradingview_symbol: XAUUSD
  enable_x: false
  x_bearer_env: X_BEARER_TOKEN
  reddit_query: xauusd gold market
  x_query: xauusd OR gold OR fed OR inflation
  max_items_per_source: 12
memory:
  enabled: true
  db_path: reports/runtime/ftmo/agent_memory.sqlite
  embedding_dim: 256
  retrieval_top_k: 6
  retrieval_kinds:
  - signal
  - assistant_note
  - kb_document
  ingest_kb_on_start: false
  knowledge_base_paths: []
communication:
  enabled_default: false
  popup_on_channel_message: false
  popup_on_emergency: false
operation_feedback:
  enabled: true
  root_subdir: operation_feedback
  write_by_job_logs: true
  capture_state_transitions: true
  capture_notifications: true
  capture_agent_a_samples: true
  capture_agent_b_samples: true
approval_policy:
  normal_timeout_seconds: 1800
  fast_timeout_seconds: 120
  emergency_lead_minutes: 5
  channel_user_triggered_only: true
  auto_approve_mandatory_session_programmed: true
  auto_approve_opposing_countertrade: true
  auto_approve_below_agent_b_count: 3
emergency:
  enabled: true
  require_approval: false
  score_jump_threshold: 0.55
email_notifications:
  enabled: false
  smtp_host: smtp.gmail.com
  smtp_port: 587
  use_tls: true
  sender_email: env:TSMM_EMAIL_SENDER
  receiver_email: env:TSMM_EMAIL_RECEIVER
  username: env:TSMM_EMAIL_USERNAME
  password: env:TSMM_EMAIL_APP_PASSWORD
telegram_notifications:
  enabled: true
  bot_token: env:TSMM_TELEGRAM_BOT_TOKEN
  chat_id: env:TSMM_TELEGRAM_CHAT_ID
  parse_mode: plain
  disable_web_page_preview: true
  send_on_all_messages: true
telegram_listener:
  enabled: true
  allowed_chat_ids: []
  log_conversations: true
  reply_on_non_command: true
  auto_resume_waiting_jobs_enabled: true
  auto_resume_waiting_jobs_interval_seconds: 60
  ai_agent:
    enabled: true
    provider: local_ollama
    timeout_seconds: 45
    external_service:
      enabled: false
      base_url: http://127.0.0.1:8787
      chat_endpoint: /chat
      timeout_seconds: 90
      auto_execute: true
      api_key: env:AORQ_AGENTIC_API_KEY
  require_secret: false
  secret_env: TSMM_TELEGRAM_COMMAND_SECRET
  allowed_commands:
  - status
  - deploy
  - trading
  - endpoint
  - ui
  - resource
  poll_seconds: 3
  latest_request_status_interval_seconds: 120
  active_jobs_status_interval_seconds: 300
  command_prefix: /ftmo
  allow_natural_language: false
  run_deploy_script: scripts/deploy_agent_pipeline.py
  default_pipeline_config: config/agent_pipeline_ftmo.yaml
  scheduled_model_refresh:
    enabled: false
  allow_shell_commands: false
endpoint_lifecycle:
  on_demand_start: true
  service_script: scripts/local_signal_endpoint_service.py
  host: 127.0.0.1
  port: 8000
  startup_wait_seconds: 20
resource_guard:
  enabled: true
  cpu_threshold_pct: 95
  ram_threshold_pct: 95
  sustained_seconds: 240
  cooldown_seconds: 600
  disable_endpoint_on_relief: true
  disable_uis_on_relief: true
boot_recovery:
  enabled: true
  restart_listener: true
  restart_endpoint: false
  resume_active_jobs: true
  send_telegram_alert: true
  send_console_alert: true
  console_alert_timeout_seconds: 20
dashboard:
  enabled: true
  master_table_path: data\market_data.sqlite
  startup_sync_enabled: true
  startup_max_pulls: 2
  startup_freshness_lag_minutes: 20
  raw_data_path: data/xauusd/xauusd_1m_live.csv
  tiingo_symbol: xauusd
  tiingo_rate: 1min
  tiingo_token_env: TIINGO_API_TOKEN
  auto_update_master: true
  auto_update_every_ticks: 1
  live_past_minutes: 1440
  heatmap_minutes: 480
  pdf_minutes: 360
  group_minutes: 420
  refresh_seconds: 60
