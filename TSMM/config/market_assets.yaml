assets:
  xauusd:
    enabled: true
    provider: tiingo_fx
    provider_symbol: xauusd
    symbol: XAUUSD
    db_path: data/market_data.sqlite
    rate: 1min
    token_env: TIINGO_API_TOKEN
    token_envs: [TIINGO_API_TOKEN]
    token_rotation_state_path: reports/runtime/tiingo_token_rotation_state.json
    timeframes_minutes: [10, 30, 60, 180, 420, 720, 1440]

  us500:
    enabled: true
    provider: tiingo_iex_proxy
    source_ticker: SPY
    symbol: US500
    db_path: data/market_data_us500.sqlite
    rate: 1min
    token_env: TIINGO_API_TOKEN_ALT
    token_envs: [TIINGO_API_TOKEN_ALT]
    token_rotation_state_path: reports/runtime/us500/tiingo_token_rotation_state.json
    calibration_lookback_days: 60
    minimum_calibration_samples: 100
    maximum_relative_mad: 0.02
    maximum_seam_jump_pct: 8.0
    timeframes_minutes: [10, 30, 60, 180, 420, 720, 1440]
