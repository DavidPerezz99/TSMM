# Sweep for 10m HIGH modeling with y_diff as the primary forecast target.

smart_generation: true

models_to_run:
  univariate: [ulr, nbeats]
  multivariate: []

# Dataset + task
problem_type: ["univariate"]
data_path: ["data/market_data.sqlite"]
data_timeframe_minutes: [10]
sql_symbol: ["XAUUSD"]
sql_source_mode: ["cache"]
target_col: ["HIGH"]

# Global search space (kept compact for practical runtime)
n_steps: [72, 96]
m_steps: [1]
horizon: [6]
split_ratio: [0.82]
test_size: [120]
records: [4000, 3000, 2000, 1000]

# N-BEATS-specific
nbeats.model_type: ["interpretable"]
nbeats.hidden_size: [128, 256]
nbeats.learning_rate: [0.001, 0.003]
nbeats.epochs: [60]
nbeats.stacks_config:
  -
    - type: "trend"
      num_blocks: 3
      degree: 3
    - type: "seasonality"
      num_blocks: 3
      num_harmonics: 8

# Input/target recipes
# Keep y_diff as the primary metric anchor.
input_target_sets:
  -
    input_features: ["HIGH", "y_diff", "Low_return", "Price_return", "Open_return"]
    target_features: ["y_diff", "Price_return", "Low_return", "Open_return"]
  -
    input_features: ["HIGH", "y_diff", "Low_return", "Price_return"]
    target_features: ["y_diff", "Price_return", "Low_return"]
  -
    input_features: ["HIGH", "Price_return", "y_diff"]
    target_features: ["y_diff", "Price_return"]
  -
    input_features: ["HIGH", "Open_return", "y_diff"]
    target_features: ["y_diff", "Open_return"]    
